name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  trigger-review:
    name: Trigger AI Review Bot
    runs-on: ubuntu-latest

    steps:
      - name: Send PR payload to review bot
        run: |
          curl -X POST "${{ secrets.BOT_URL }}/review" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -d '${{ toJson(github.event) }}'
